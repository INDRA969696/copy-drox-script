<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoFarmMaker</title>
  <link rel="stylesheet" href="/main/css/z999.css">
</head>
<body>
  <h3 class="title"></h3>
  <button id="clipboardbtn" class="clipboard">Copy Here</button>
  <div class="script-place"><span class="description"></span></div>
  <script>
    let TextScript = `-- DraLibs (Open Source Library) : https://github.com/INDRA969696/DrScriptHub
local dralibs = loadstring(game:HttpGet("https://raw.githubusercontent.com/INDRA969696/DrScriptHub/main/DraLibrary/DraLibs"))()
local Hub = dralibs:window("One Click Inf Fuel")

local Players = game:GetService("Players")
local Usn = Players.LocalPlayer.Name

Hub:button("Thruster", function()
  local folder = workspace.Blocks:FindFirstChild(Usn)
  if folder then
    for _, a in ipairs(folder:GetChildren()) do
      if a.Name == "Thruster" and a:IsA("Model") then
        local fuel = a:FindFirstChild("Fuel")
        if fuel then
          fuel.Value = 999999999999999999999999999999999
        end
      end
    end
  end
end)

Hub:button("UltraThruster", function()
  local folder = workspace.Blocks:FindFirstChild(Usn)
  if folder then
    for _, a in ipairs(folder:GetChildren()) do
      if a.Name == "UltraThruster" and a:IsA("Model") then
        local fuel = a:FindFirstChild("Fuel")
        if fuel then
          fuel.Value = 999999999999999999999999999999999
        end
      end
    end
  end
end)

Hub:button("Jet Turbine", function()
  local folder = workspace.Blocks:FindFirstChild(Usn)
  if folder then
    for _, a in ipairs(folder:GetChildren()) do
      if a.Name == "JetTurbine" and a:IsA("Model") then
        local fuel = a:FindFirstChild("Fuel")
        if fuel then
          fuel.Value = 999999999999999999999999999999999
        end
      end
    end
  end

end)`;

    function copyToClipboard() {
      navigator.clipboard.writeText(TextScript);
    }

    document.getElementById('clipboardbtn').addEventListener('click', () => copyToClipboard());
  </script>
</body>
</html>
